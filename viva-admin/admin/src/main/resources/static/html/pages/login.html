<!-- Login Page -->
<div class="login-box">
    <div class="logo">
        <i class="fas fa-graduation-cap"></i>
    </div>
    <h1>VIVA Admin</h1>
    <p class="subtitle">Teacher & Admin Portal</p>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" value="admin@viva.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 15px;">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
    </form>
    <div id="login-error" class="alert alert-danger" style="margin-top: 15px; display: none;"></div>
    <div class="login-footer">
        <p>Demo: Email: admin@viva.com, Password: any value</p>
    </div>
</div>
